name: Release

concurrency:
  group: sdk-release
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - .github/sdk-version
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact merged main commit from the failed release run
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
    steps:
      - name: Validate invocation
        shell: bash
        env:
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release must run from main." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$CANDIDATE_SHA_INPUT" ]]; then
            echo "Manual release retries require the exact candidate_sha from the failed run." >&2
            exit 1
          fi
          if [[ -n "$CANDIDATE_SHA_INPUT" && ! "$CANDIDATE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be an exact lowercase 40-character commit SHA." >&2
            exit 1
          fi

      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate SDK release tag
        id: release
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release candidate $(git rev-parse HEAD) is not on protected main." >&2
            exit 1
          fi
          candidate_sha="$(git rev-parse HEAD)"
          requested_tag="$(.github/scripts/sdk-release-tag.sh)"
          .github/scripts/release-tag-state.sh "$requested_tag" "$candidate_sha" >/dev/null
          .github/scripts/validate-codex-metadata.sh
          echo "tag=${requested_tag}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## SDK release candidate"
            echo
            echo "- Tag: \`${requested_tag}\`"
            echo "- Candidate: \`${candidate_sha}\`"
            echo "- SDK version: \`$(<.github/sdk-version)\`"
            echo "- Codex version: \`$(<.github/codex/version)\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: validate-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tests.yml
    with:
      candidate_sha: ${{ needs.validate-release.outputs.candidate_sha }}

  e2e:
    needs: [validate-release, quality]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      candidate_sha: ${{ needs.validate-release.outputs.candidate_sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publish-tag:
    name: Publish ${{ needs.validate-release.outputs.tag }}
    needs: [validate-release, quality, e2e]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request and pinned Codex metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          git fetch origin main --tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release candidate $(git rev-parse HEAD) is no longer on protected main." >&2
            exit 1
          fi
          .github/scripts/release-tag-state.sh "$REQUESTED_TAG" HEAD >/dev/null
          .github/scripts/validate-codex-metadata.sh
          .github/scripts/test-install-codex-cli.sh

      - name: Create and push immutable tag only
        shell: bash
        env:
          REQUESTED_TAG: ${{ needs.validate-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_state="$(.github/scripts/release-tag-state.sh "$REQUESTED_TAG" HEAD)"
          if [[ "$tag_state" == "absent" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$REQUESTED_TAG" -m "Release ${REQUESTED_TAG}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "refs/tags/${REQUESTED_TAG}"
          fi

          remote_refs="$(git ls-remote origin "refs/tags/${REQUESTED_TAG}" "refs/tags/${REQUESTED_TAG}^{}")"
          remote_tag_object="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          remote_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          if [[ "$remote_tag_object" != "$(git rev-parse "refs/tags/${REQUESTED_TAG}")" ]]; then
            echo "Remote ${REQUESTED_TAG} tag object does not match the verified local annotated tag." >&2
            exit 1
          fi
          if [[ "$remote_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Remote ${REQUESTED_TAG} did not resolve to the gated commit." >&2
            exit 1
          fi
          echo "${REQUESTED_TAG} is published at $(git rev-parse HEAD)."
