name: Quality

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test verified Codex installer
        run: |
          .github/scripts/validate-codex-metadata.sh
          .github/scripts/test-validate-codex-metadata.sh
          .github/scripts/test-install-codex-cli.sh
          .github/scripts/test-validate-release-tag.sh
          .github/scripts/test-sdk-release-tag.sh
          .github/scripts/test-release-tag-state.sh
          .github/scripts/test-validate-sdk-version-transition.sh
          .github/scripts/test-content-manifest.sh

      - name: Validate SDK version transition
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/validate-sdk-version-transition.sh "$BASE_SHA" HEAD

      - name: Validate workflows
        if: matrix.go-version == '1.25.12'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.go-version }}" == "1.25.12" ]]; then
            go test -covermode=atomic -coverprofile=coverage.out ./...
          else
            go test ./...
          fi

      - name: Preserve coverage profile
        if: matrix.go-version == '1.25.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

      - name: Test with race detector
        run: go test -race ./...

      - name: Install pinned analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Staticcheck
        run: staticcheck ./...

      - name: Vulnerability scan
        run: govulncheck ./...

  coverage:
    name: Coverage report
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Publish coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
          flags: unit
          use_oidc: true
          version: v11.3.1
