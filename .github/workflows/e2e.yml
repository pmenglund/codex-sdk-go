name: Trusted E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: trusted-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Trusted e2e must run from main." >&2
            exit 1
          fi

  e2e:
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install checksum-verified Codex CLI
        run: |
          .github/scripts/install-codex-cli.sh --destination "${RUNNER_TEMP}/codex-bin" --target linux-x86_64
          echo "${RUNNER_TEMP}/codex-bin" >> "${GITHUB_PATH}"

      - name: Run credentialed end-to-end tests
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "Missing OPENAI_API_KEY in the protected e2e environment." >&2
            exit 1
          fi
          login_params="$(jq -cn --arg api_key "$OPENAI_API_KEY" '{type:"apiKey", apiKey:$api_key}')"
          unset OPENAI_API_KEY
          CODEX_E2E_LOGIN_PARAMS_JSON="$login_params" go test -timeout=15m -tags=e2e ./test/e2e
